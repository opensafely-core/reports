name: CI

env:
  IMAGE_NAME: reports
  PUBLIC_IMAGE_NAME: ghcr.io/opensafely-core/reports
  REGISTRY: ghcr.io
  SSH_AUTH_SOCK: /tmp/agent.sock

on:
  push:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-assets:
    name: "Build: Assets"
    runs-on: "ubuntu-24.04"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Install node_modules
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Store assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-assets
          path: assets/dist

  lint-python:
    name: "Lint: Python"
    needs:
      - "build-assets"
    runs-on: "ubuntu-24.04"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: "opensafely-core/setup-action@d9171097dd0d37bdb7bed58f701eb03ff317ed17" # v1.7.0
        with:
          install-uv: true
          install-just: true
      - name: Check formatting, linting and import sorting
        run: just check

  test-python:
    name: "Test: Python"
    needs:
      - "build-assets"
      - "lint-python"
    runs-on: "ubuntu-24.04"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: "opensafely-core/setup-action@d9171097dd0d37bdb7bed58f701eb03ff317ed17" # v1.7.0
        with:
          install-uv: true
          install-just: true

      - name: Retrieve assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-assets
          path: assets/dist

      - name: Run tests
        env:
          SECRET_KEY: 12345
          REQUESTS_CACHE_NAME: test_cache
          SOCIAL_AUTH_NHSID_KEY: dummy-client-id
          SOCIAL_AUTH_NHSID_SECRET: dummy-secret
          SOCIAL_AUTH_NHSID_API_URL: https://dummy-nhs.net/oidc
          ASSETS_DEV_MODE: True
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          uv run manage.py collectstatic --no-input --clear
          just test

  lint-dockerfile:
    name: "Lint: Docker"
    runs-on: "ubuntu-24.04"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: docker/Dockerfile

  docker-test:
    name: "Test: Python in Docker"
    needs:
      - "build-assets"
      - "lint-dockerfile"
    runs-on: "ubuntu-24.04"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: "opensafely-core/setup-action@d9171097dd0d37bdb7bed58f701eb03ff317ed17" # v1.7.0
        with:
          install-uv: true
          install-just: true

      - name: Retrieve assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-assets
          path: assets/dist

      - name: Build docker image and run tests in it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # build docker and run test
          just docker/test

  deploy:
    name: "Deploy"
    needs:
      - "build-assets"
      - "docker-test"
      - "test-python"
    runs-on: "ubuntu-24.04"

    permissions:
      contents: read
      packages: write  # Required to push the production image to GitHub Container Registry

    if: github.ref == 'refs/heads/main'

    concurrency:
      group: "deploy-production"
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: "opensafely-core/setup-action@d9171097dd0d37bdb7bed58f701eb03ff317ed17" # v1.7.0
        with:
          install-uv: true
          install-just: true

      - name: Build docker image
        run: |
          # docker-test step will build the dev image by default, so build the prod image
          just docker/build prod

      - name: Login to Packages Container registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"

      - name: Publish docker image
        run: |
          docker tag "$IMAGE_NAME" "$PUBLIC_IMAGE_NAME:latest"
          docker push "$PUBLIC_IMAGE_NAME:latest"

      - name: Setup SSH Agent
        env:
          DOKKU3_DEPLOY_SSH_KEY: ${{ secrets.DOKKU3_DEPLOY_SSH_KEY }}
        run: |
          ssh-agent -a "$SSH_AUTH_SOCK" > /dev/null
          ssh-add - <<< "$DOKKU3_DEPLOY_SSH_KEY"

      - name: Deploy
        run: |
          SHA=$(docker inspect --format='{{join .RepoDigests "\n"}}' "$PUBLIC_IMAGE_NAME:latest" | grep "$PUBLIC_IMAGE_NAME")
          echo "Deploying $SHA to dokku3"
          ssh -o "UserKnownHostsFile=/dev/null" -o "StrictHostKeyChecking=no" dokku@dokku3.ebmdatalab.net git:from-image reports "$SHA"

      - name: Create Sentry release
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_RELEASE_INTEGRATION_TOKEN }}
          SENTRY_ORG: ebm-datalab
          SENTRY_PROJECT: reports
        with:
          environment: production
          ignore_empty: true
