[project]
name = "reports"
description = "Website for viewing OpenSAFELY reports"
readme = "README.md"
authors = [{name = "OpenSAFELY", email = "tech@opensafely.org"}]
version = "0.1.0"
license = {file = "LICENSE"}
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)"
]
requires-python = ">=3.12"

dependencies = [
    "bs4>=0.0.2",
    "django>=5.2,<6.0",
    "django-csp>=4.0",
    "django-extensions>=4.1",
    "django-permissions-policy>=4.32.0",
    "django-structlog>=10.1.0",
    "django-vite>=3.1.0",
    "environs[django]>=15.1.0",
    "furl>=2.1.4",
    "gunicorn>=26.0.0",
    "lxml[html-clean]>=6.1.1",
    "osgithub>=0.7.1",
    "requests-cache>=1.3.3",
    "sentry-sdk>=2.67.1",
    "whitenoise[brotli]>=6.12.0",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.15.3",
    "factory-boy>=3.3.3",
    "httpretty>=1.1.4",
    "pip-tools>=7.6.0",
    "pre-commit>=4.6.1",
    "pytest-django>=4.12.0",
    "pytest-env>=1.7.0",
    "pytest-freezer>=0.4.9",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.1",
]

[tool.uv]
exclude-newer = "1 week"
required-version = ">=0.12.0"

[tool.coverage.run]
branch = true
dynamic_context = "test_function"
omit = [
  ".direnv/*",
  ".venv/*",
  "reports/asgi.py",
  "reports/settings.py",
  "reports/wsgi.py",
  "services/sentry.py",
  "gateway/migrations/*",
  "reports/migrations/*",
  "manage.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.coverage.html]
show_contexts = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "reports.settings"
env = [
  "SECRET_KEY=12345",
  "REQUESTS_CACHE_NAME=test_cache",
  "ASSETS_DEV_MODE=True",
]
filterwarnings = [
    "ignore:distutils Version classes are deprecated:DeprecationWarning:marshmallow",
    "ignore:distutils Version classes are deprecated:DeprecationWarning:pytest_freezegun",
]

[tool.ruff]
line-length = 88
exclude = [
  ".direnv",
  ".git",
  ".github",
  ".ipynb_checkpoints",
  ".pytest_cache",
  ".venv",
  "__pycache__",
  "docker",
  "htmlcov",
  "venv",
]

[tool.ruff.lint]
isort.lines-after-imports = 2
extend-select = [
  "A",  # flake8-builtins
  "I",  # isort
  "INP",  # flake8-no-pep420
  "ISC",  # flake8-implicit-str-concat
  "UP",  # pyupgrade
  "W",  # pycodestyle warning
]
extend-ignore = [
  "A005", # ignore stdlib-module-shadowing. Would need to re-name services.logging.
  "E501", # ignore line-length. We judge case-by-case.
]

[tool.ruff.lint.per-file-ignores]
"gunicorn.conf.py" = ["INP001"]
"manage.py" = ["INP001"]
# RUF012 warns of mutable class attributes.
# Django uses mutable class attributes extensively.
# https://github.com/astral-sh/ruff/issues/5243
"reports/admin.py" = ["RUF012"]
"reports/models.py" = ["RUF012"]
"**/migrations/*.py" = ["RUF012"]
